name: Impostor Legacy - Fast Type Check

# Runs only the Haxe compile phase (typing + macros) for the Android target,
# with --no-output, so it never touches the NDK/clang toolchain or Gradle.
# This exists to catch type/syntax errors in ~1-2 minutes instead of waiting
# for the full ~10-20 min Android APK build (devBuilds.yml) to fail on the
# same error. It does NOT produce an APK and proves nothing about runtime
# behavior - it's a compile-error tripwire, not a substitute for a real build.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string
  # TEMPORARY: workflow_dispatch can't be triggered via API/UI until this file
  # lands on the default branch. Using push to validate it on this feature
  # branch first; remove this trigger once confirmed working.
  push:
    branches:
      - claude/impostor-legacy-android-79u6sz

jobs:
  TypeCheck:
    name: Type Check (Android, no NDK/Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: 4.3.7

      - name: Cache Haxe libraries
        id: haxelibs-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            .haxelib
          key: haxelibs-ubuntu-v3-${{ hashFiles('.hxpkg') }}

      - name: Read Lime pin from .hxpkg
        id: lime-pin
        run: |
          LIME_LINK=$(jq -r '.[0].pkgs[] | select(.name=="lime") | .link' .hxpkg)
          LIME_COMMIT=$(jq -r '.[0].pkgs[] | select(.name=="lime") | .branch' .hxpkg)
          echo "link=$LIME_LINK" >> "$GITHUB_OUTPUT"
          echo "commit=$LIME_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Cache Lime (source + built artifacts)
        id: lime-cache
        uses: actions/cache@v4
        with:
          path: .haxelib/lime
          key: lime-android-v4-${{ steps.lime-pin.outputs.commit }}-${{ runner.os }}

      # Only needed to build lime's own CLI-tool ndll (Linux64) below -
      # nothing here is Android/NDK-specific.
      - name: Install Linux system deps
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-13 g++-13 vlc libvlc-dev libvlccore-dev vlc-bin \
            libwayland-dev libwayland-bin wayland-protocols libasound2-dev \
            libpulse-dev libjack-jackd2-dev libpipewire-0.3-dev libgl1-mesa-dev \
            libegl1-mesa-dev libglu1-mesa-dev libdbus-1-dev libudev-dev \
            libxkbcommon-dev libx11-dev libxext-dev libx11-xcb-dev libxfixes-dev \
            libxss-dev libxrender-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxxf86vm-dev libgbm-dev libdrm-dev libdecor-0-dev \
            libvulkan-dev pkg-config

      - name: Setup haxelib root
        run: haxelib setup ~/haxelib

      - name: Install Haxe libraries
        if: steps.haxelibs-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install --force

      - name: Prepare Lime source
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf .haxelib/lime
          git clone ${{ steps.lime-pin.outputs.link }} .haxelib/lime/git
          git -C .haxelib/lime/git checkout ${{ steps.lime-pin.outputs.commit }}
          git -C .haxelib/lime/git submodule update --init --recursive --force

      - name: Register Lime dev lib
        run: haxelib dev lime .haxelib/lime/git

      - name: Ensure hxcpp for Lime rebuild
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: haxelib install hxcpp > /dev/null --quiet

      - name: Wrap g++-13 to force C++23
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/cxx-wrap
          printf '#!/bin/bash\nexec /usr/bin/g++-13 "$@" -std=c++23\n' > /tmp/cxx-wrap/g++-13
          chmod +x /tmp/cxx-wrap/g++-13
          echo "/tmp/cxx-wrap" >> $GITHUB_PATH

      # Builds lime's own CLI-tool ndll so `haxelib run lime ...` works at all
      # on this runner. NOT the Android runtime .so - that step (and the NDK/
      # SDL/OpenAL patches that only matter for compiling it) is intentionally
      # skipped below since nothing here invokes the NDK.
      - name: Rebuild Linux Lime ndll
        if: steps.lime-cache.outputs.cache-hit != 'true'
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          haxelib run lime rebuild cpp -release
          if [ ! -f .haxelib/lime/git/ndll/Linux64/lime.ndll ]; then
            echo "ERROR: Missing Lime ndll"
            exit 1
          fi

      - name: Configure Android
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Type-check only (haxe --no-output, no NDK/Gradle)
        run: |
          BUILD_FLAGS="${{ inputs.buildFlags }}"
          if [ -n "$BUILD_FLAGS" ]; then
            haxelib run lime display android -release -D "$BUILD_FLAGS" > /tmp/typecheck.hxml
          else
            haxelib run lime display android -release > /tmp/typecheck.hxml
          fi
          echo "=== Generated .hxml ==="
          cat /tmp/typecheck.hxml
          echo "======================="
          haxe /tmp/typecheck.hxml
