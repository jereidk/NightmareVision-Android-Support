            if grep -q '^#ifndef __ANDROID__' "$SDL_PROC_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#ifndef __ANDROID__\n'; cat "$SDL_PROC_FILE"; printf '\n#endif\n'; } > /tmp/sdlprocfix
              mv /tmp/sdlprocfix "$SDL_PROC_FILE"
