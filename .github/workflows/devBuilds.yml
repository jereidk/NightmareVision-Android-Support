name: Impostor Legacy - Dev Builds

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string

jobs:

  # ── Fat APK (arm64 + armv7 in one build). Disabled — superseded by the two
  #    single-ABI jobs below.  Keep for reference; re-enable by removing `if`.
  Android:
    if: ${{ false }}
    name: Build Android (fat APK – disabled)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: 4.3.7

      - name: Cache Haxe libraries
        id: haxelibs-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            .haxelib
          key: haxelibs-ubuntu-v3-${{ hashFiles('.hxpkg') }}

      - name: Cache Lime (source + built artifacts)
        id: lime-cache
        uses: actions/cache@v4
        with:
          path: .haxelib/lime
          key: lime-android-v2-6421de16b9dfa4fb55c19f12db65d392a57585c8-${{ runner.os }}

      - name: Install Linux system deps
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-13 g++-13 vlc libvlc-dev libvlccore-dev vlc-bin \
            libwayland-dev libwayland-bin wayland-protocols libasound2-dev \
            libpulse-dev libjack-jackd2-dev libpipewire-0.3-dev libgl1-mesa-dev \
            libegl1-mesa-dev libglu1-mesa-dev libdbus-1-dev libudev-dev \
            libxkbcommon-dev libx11-dev libxext-dev libx11-xcb-dev libxfixes-dev \
            libxss-dev libxrender-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxxf86vm-dev libgbm-dev libdrm-dev libdecor-0-dev \
            libvulkan-dev pkg-config

      - name: Setup haxelib root
        run: haxelib setup ~/haxelib

      - name: Install Haxe libraries
        if: steps.haxelibs-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install

      - name: Prepare Lime source
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf .haxelib/lime
          git clone https://github.com/FunkinCrew/lime .haxelib/lime/git
          git -C .haxelib/lime/git checkout 6421de16b9dfa4fb55c19f12db65d392a57585c8
          git -C .haxelib/lime/git submodule update --init --recursive --force

      - name: Register Lime dev lib
        run: haxelib dev lime .haxelib/lime/git

      - name: Ensure hxcpp for Lime rebuild
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: haxelib install hxcpp > /dev/null --quiet

      - name: Wrap g++-13 to force C++23
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/cxx-wrap
          printf '#!/bin/bash\nexec /usr/bin/g++-13 "$@" -std=c++23\n' > /tmp/cxx-wrap/g++-13
          chmod +x /tmp/cxx-wrap/g++-13
          echo "/tmp/cxx-wrap" >> $GITHUB_PATH

      - name: Rebuild Linux Lime ndll
        if: steps.lime-cache.outputs.cache-hit != 'true'
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          haxelib run lime rebuild cpp -release
          if [ ! -f .haxelib/lime/git/ndll/Linux64/lime.ndll ]; then
            echo "ERROR: Missing Lime ndll"
            exit 1
          fi

      - name: Prepare NDK clang++ for Android
        run: |
          mkdir -p /tmp/ndk-wrap
          NDK_PREBUILT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          {
            printf '#!/bin/bash\n'
            printf 'for arg in "$@"; do\n'
            printf '  case "$arg" in\n'
            printf '    *.c) exec "%s/bin/clang++" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@" ;;\n' "$NDK_PREBUILT" "$NDK_PREBUILT"
            printf '  esac\n'
            printf 'done\n'
            printf 'exec "%s/bin/clang++" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@" -std=c++23\n' "$NDK_PREBUILT" "$NDK_PREBUILT"
          } > /tmp/ndk-wrap/clang++
          printf '#!/bin/bash\nexec "%s/bin/clang" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@"\n' \
            "$NDK_PREBUILT" "$NDK_PREBUILT" > /tmp/ndk-wrap/clang
          printf '#!/bin/bash\nexec "%s/bin/llvm-strip" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/aarch64-linux-android-strip
          printf '#!/bin/bash\nexec "%s/bin/llvm-strip" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/arm-linux-androideabi-strip
          chmod +x /tmp/ndk-wrap/clang++ /tmp/ndk-wrap/clang \
            /tmp/ndk-wrap/aarch64-linux-android-strip /tmp/ndk-wrap/arm-linux-androideabi-strip
          echo "/tmp/ndk-wrap" >> $GITHUB_PATH
          mv "$NDK_PREBUILT/bin/ld.lld" "$NDK_PREBUILT/bin/ld.lld.real"
          echo '' \
            | base64 -d | sed "s|@NDK@|$NDK_PREBUILT|g" > "$NDK_PREBUILT/bin/ld.lld"
          chmod +x "$NDK_PREBUILT/bin/ld.lld"

      - name: Configure Android
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-

      - name: Patch SDL posix process for Android
        run: |
          echo "=== Scanning for SDL_posixprocess.c ==="
          FOUND=0
          while IFS= read -r SDL_FILE; do
            echo "Found: $SDL_FILE"
            if grep -q '^#ifndef __ANDROID__' "$SDL_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#ifndef __ANDROID__\n'; cat "$SDL_FILE"; printf '\n#endif\n'; } > /tmp/sdlfix
              mv /tmp/sdlfix "$SDL_FILE"
              echo "  Patched ($(wc -l < "$SDL_FILE") lines). First line: $(head -1 "$SDL_FILE")"
            fi
            FOUND=1
          done < <(find .haxelib/lime -name "SDL_posixprocess.c" -type f 2>/dev/null)
          if [ "$FOUND" = "0" ]; then
            echo "WARNING: SDL_posixprocess.c not found in .haxelib/lime (may be a cache-hit-only run)"
            find .haxelib -maxdepth 5 -type d 2>/dev/null | head -20 || true
          fi

          echo "=== Patching OpenAL lock-free assertion for ARM32 ==="
          while IFS= read -r AL_FILE; do
            echo "Found: $AL_FILE"
            if grep -q 'is_always_lock_free' "$AL_FILE"; then
              sed -i 's/static_assert(std::atomic<ContextBase::AsyncEventBitset>::is_always_lock_free,.*);/static_assert(true, "lock-free check relaxed for Android ARM32");/' "$AL_FILE"
              echo "  Patched: removed is_always_lock_free assertion"
            else
              echo "  No matching assertion found (already patched or different version)"
            fi
          done < <(find .haxelib/lime -path "*/openal/core/context.cpp" -type f 2>/dev/null)

          echo "=== Patching SDL_openxrdyn.c: OpenXR unsupported on ARM32 ==="
          while IFS= read -r XR_FILE; do
            echo "Found: $XR_FILE"
            if grep -q '^#if !defined(__arm__)' "$XR_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#if !defined(__arm__)\n'; cat "$XR_FILE"; printf '\n#endif\n'; } > /tmp/sdlxrfix
              mv /tmp/sdlxrfix "$XR_FILE"
              echo "  Patched: wrapped with #if !defined(__arm__)"
            fi
          done < <(find .haxelib/lime -name "SDL_openxrdyn.c" -type f 2>/dev/null)

          echo "=== Patching SDL_process.c: exclude process creation API on Android ==="
          while IFS= read -r SDL_PROC_FILE; do
            echo "Found: $SDL_PROC_FILE"
            if grep -q '^#ifndef __ANDROID__' "$SDL_PROC_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#ifndef __ANDROID__\n'; cat "$SDL_PROC_FILE"; printf '\n#endif\n'; } > /tmp/sdlprocfix
              mv /tmp/sdlprocfix "$SDL_PROC_FILE"
              echo "  Patched ($(wc -l < "$SDL_PROC_FILE") lines). First line: $(head -1 "$SDL_PROC_FILE")"
            fi
          done < <(find .haxelib/lime -name "SDL_process.c" -type f 2>/dev/null)

      - name: Rebuild Android Lime so
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          haxelib run lime rebuild android -release
          if [ ! -f .haxelib/lime/git/ndll/Android/liblime-64.so ]; then
            echo "ERROR: Missing Liblime 64 so"
            exit 1
          fi

      - name: Compile
        run: |
          BUILD_FLAGS="${{inputs.buildFlags}}"
          if [ -n "$BUILD_FLAGS" ]; then
            haxelib run lime build android -release -D $BUILD_FLAGS
          else
            haxelib run lime build android -release
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NightmareVision (Android)
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # ARM64 (aarch64) — covers all modern Android devices (2019+).
  # No ld.lld wrapper needed: the ARM32 sysroot issue does not affect arm64.
  # ─────────────────────────────────────────────────────────────────────────────
  Android-ARM64:
    name: Build Android (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: false  # content/NMV-Base-Game is 296 MB and is base-game content
                             # VS Impostor Legacy is self-contained in assets/legacy/ (607 MB).
                             # Re-enable if the mod starts referencing NMV base-game assets.

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: 4.3.7

      - name: Cache Haxe libraries
        id: haxelibs-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            .haxelib
          key: haxelibs-ubuntu-v3-${{ hashFiles('.hxpkg') }}

      - name: Cache Lime (source + built artifacts)
        id: lime-cache
        uses: actions/cache@v4
        with:
          path: .haxelib/lime
          key: lime-android-v2-6421de16b9dfa4fb55c19f12db65d392a57585c8-${{ runner.os }}

      - name: Install Linux system deps
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-13 g++-13 vlc libvlc-dev libvlccore-dev vlc-bin \
            libwayland-dev libwayland-bin wayland-protocols libasound2-dev \
            libpulse-dev libjack-jackd2-dev libpipewire-0.3-dev libgl1-mesa-dev \
            libegl1-mesa-dev libglu1-mesa-dev libdbus-1-dev libudev-dev \
            libxkbcommon-dev libx11-dev libxext-dev libx11-xcb-dev libxfixes-dev \
            libxss-dev libxrender-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxxf86vm-dev libgbm-dev libdrm-dev libdecor-0-dev \
            libvulkan-dev pkg-config

      - name: Setup haxelib root
        run: haxelib setup ~/haxelib

      - name: Install Haxe libraries
        if: steps.haxelibs-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install

      - name: Prepare Lime source
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf .haxelib/lime
          git clone https://github.com/FunkinCrew/lime .haxelib/lime/git
          git -C .haxelib/lime/git checkout 6421de16b9dfa4fb55c19f12db65d392a57585c8
          git -C .haxelib/lime/git submodule update --init --recursive --force

      - name: Register Lime dev lib
        run: haxelib dev lime .haxelib/lime/git

      - name: Ensure hxcpp for Lime rebuild
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: haxelib install hxcpp > /dev/null --quiet

      - name: Wrap g++-13 to force C++23
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/cxx-wrap
          printf '#!/bin/bash\nexec /usr/bin/g++-13 "$@" -std=c++23\n' > /tmp/cxx-wrap/g++-13
          chmod +x /tmp/cxx-wrap/g++-13
          echo "/tmp/cxx-wrap" >> $GITHUB_PATH

      - name: Rebuild Linux Lime ndll
        if: steps.lime-cache.outputs.cache-hit != 'true'
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          haxelib run lime rebuild cpp -release
          if [ ! -f .haxelib/lime/git/ndll/Linux64/lime.ndll ]; then
            echo "ERROR: Missing Lime ndll"
            exit 1
          fi

      - name: Prepare NDK clang++ for Android
        run: |
          mkdir -p /tmp/ndk-wrap
          NDK_PREBUILT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          {
            printf '#!/bin/bash\n'
            printf 'for arg in "$@"; do\n'
            printf '  case "$arg" in\n'
            printf '    *.c) exec "%s/bin/clang++" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@" ;;\n' "$NDK_PREBUILT" "$NDK_PREBUILT"
            printf '  esac\n'
            printf 'done\n'
            printf 'exec "%s/bin/clang++" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@" -std=c++23\n' "$NDK_PREBUILT" "$NDK_PREBUILT"
          } > /tmp/ndk-wrap/clang++
          printf '#!/bin/bash\nexec "%s/bin/clang" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@"\n' \
            "$NDK_PREBUILT" "$NDK_PREBUILT" > /tmp/ndk-wrap/clang
          printf '#!/bin/bash\nexec "%s/bin/llvm-strip" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/aarch64-linux-android-strip
          printf '#!/bin/bash\nexec "%s/bin/llvm-strip" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/arm-linux-androideabi-strip
          chmod +x /tmp/ndk-wrap/clang++ /tmp/ndk-wrap/clang \
            /tmp/ndk-wrap/aarch64-linux-android-strip /tmp/ndk-wrap/arm-linux-androideabi-strip
          echo "/tmp/ndk-wrap" >> $GITHUB_PATH

          # ld.lld wrapper is needed even for the ARM64 job: lime rebuild android
          # also links liblime-v7.so (ARM32) which hits the same NDK 29 sysroot issue.
          mv "$NDK_PREBUILT/bin/ld.lld" "$NDK_PREBUILT/bin/ld.lld.real"
          echo '' \
            | base64 -d | sed "s|@NDK@|$NDK_PREBUILT|g" > "$NDK_PREBUILT/bin/ld.lld"
          chmod +x "$NDK_PREBUILT/bin/ld.lld"

      - name: Configure Android
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-

      - name: Patch SDL posix process for Android
        run: |
          echo "=== Scanning for SDL_posixprocess.c ==="
          FOUND=0
          while IFS= read -r SDL_FILE; do
            echo "Found: $SDL_FILE"
            if grep -q '^#ifndef __ANDROID__' "$SDL_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#ifndef __ANDROID__\n'; cat "$SDL_FILE"; printf '\n#endif\n'; } > /tmp/sdlfix
              mv /tmp/sdlfix "$SDL_FILE"
              echo "  Patched ($(wc -l < "$SDL_FILE") lines). First line: $(head -1 "$SDL_FILE")"
            fi
            FOUND=1
          done < <(find .haxelib/lime -name "SDL_posixprocess.c" -type f 2>/dev/null)
          if [ "$FOUND" = "0" ]; then
            echo "WARNING: SDL_posixprocess.c not found in .haxelib/lime (may be a cache-hit-only run)"
            find .haxelib -maxdepth 5 -type d 2>/dev/null | head -20 || true
          fi

          echo "=== Patching OpenAL lock-free assertion for ARM32 ==="
          while IFS= read -r AL_FILE; do
            echo "Found: $AL_FILE"
            if grep -q 'is_always_lock_free' "$AL_FILE"; then
              sed -i 's/static_assert(std::atomic<ContextBase::AsyncEventBitset>::is_always_lock_free,.*);/static_assert(true, "lock-free check relaxed for Android ARM32");/' "$AL_FILE"
              echo "  Patched: removed is_always_lock_free assertion"
            else
              echo "  No matching assertion found (already patched or different version)"
            fi
          done < <(find .haxelib/lime -path "*/openal/core/context.cpp" -type f 2>/dev/null)

          echo "=== Patching SDL_openxrdyn.c: OpenXR unsupported on ARM32 ==="
          while IFS= read -r XR_FILE; do
            echo "Found: $XR_FILE"
            if grep -q '^#if !defined(__arm__)' "$XR_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#if !defined(__arm__)\n'; cat "$XR_FILE"; printf '\n#endif\n'; } > /tmp/sdlxrfix
              mv /tmp/sdlxrfix "$XR_FILE"
              echo "  Patched: wrapped with #if !defined(__arm__)"
            fi
          done < <(find .haxelib/lime -name "SDL_openxrdyn.c" -type f 2>/dev/null)

          echo "=== Patching SDL_process.c: exclude process creation API on Android ==="
          while IFS= read -r SDL_PROC_FILE; do
            echo "Found: $SDL_PROC_FILE"
            if grep -q '^#ifndef __ANDROID__' "$SDL_PROC_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#ifndef __ANDROID__\n'; cat "$SDL_PROC_FILE"; printf '\n#endif\n'; } > /tmp/sdlprocfix
              mv /tmp/sdlprocfix "$SDL_PROC_FILE"
              echo "  Patched ($(wc -l < "$SDL_PROC_FILE") lines). First line: $(head -1 "$SDL_PROC_FILE")"
            fi
          done < <(find .haxelib/lime -name "SDL_process.c" -type f 2>/dev/null)

      - name: Rebuild Android Lime so
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          haxelib run lime rebuild android -release
          if [ ! -f .haxelib/lime/git/ndll/Android/liblime-64.so ]; then
            echo "ERROR: Missing Liblime 64 so"
            exit 1
          fi

      - name: Cache hxcpp build artifacts (ARM64)
        uses: actions/cache@v4
        with:
          path: |
            export/release/android/obj
            export/release/android/haxe
            obj
          key: hxcpp-android-arm64-${{ github.sha }}
          restore-keys: |
            hxcpp-android-arm64-

      - name: Compress video assets
        run: |
          # Re-encode MP4 cutscenes: H.264 CRF 28, 1280x720, AAC 64kbps
          # ffmpeg is pre-installed on ubuntu-latest — no apt-get needed.
          # -pix_fmt yuv420p  → maximum VLC/hxvlc compatibility
          # -movflags +faststart → moov atom at front (faster playback start)
          # force_original_aspect_ratio=decrease + pad → letterbox to exact 1280x720
          # On failure the original file is kept untouched.
          find assets/legacy/videos -name "*.mp4" -type f | while IFS= read -r VID; do
            ORIG=$(stat -c%s "$VID")
            TMP="${VID%.mp4}__reenc.mp4"
            echo "Encoding: $VID  ($(numfmt --to=iec-i --suffix=B "$ORIG"))"
            if ffmpeg -y -i "$VID" \
                -c:v libx264 -crf 28 -preset faster \
                -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" \
                -pix_fmt yuv420p \
                -c:a aac -b:a 64k \
                -movflags +faststart \
                -loglevel error \
                "$TMP"; then
              NEW=$(stat -c%s "$TMP")
              echo "  → $(numfmt --to=iec-i --suffix=B "$NEW")  (saved $(numfmt --to=iec-i --suffix=B $((ORIG - NEW))))"
              mv "$TMP" "$VID"
            else
              echo "  WARNING: ffmpeg failed — keeping original"
              rm -f "$TMP"
            fi
          done
          echo "Total videos after compression: $(du -sh assets/legacy/videos/ | cut -f1)"

      - name: Compile
        env:
          HXCPP_COMPILE_THREADS: 4
        run: |
          BUILD_FLAGS="${{inputs.buildFlags}}"
          if [ -n "$BUILD_FLAGS" ]; then
            haxelib run lime build android -release -D ANDROID_ARM64_ONLY -D $BUILD_FLAGS
          else
            haxelib run lime build android -release -D ANDROID_ARM64_ONLY
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NightmareVision (Android ARM64)
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # ARM32 (armeabi-v7a) — for older / low-end 32-bit devices.
  # Requires the ld.lld wrapper to fix NDK 29 sysroot path ordering.
  # ─────────────────────────────────────────────────────────────────────────────
  Android-ARM32:
    name: Build Android (ARM32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: false  # same rationale as ARM64 job above

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: 4.3.7

      - name: Cache Haxe libraries
        id: haxelibs-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            .haxelib
          key: haxelibs-ubuntu-v3-${{ hashFiles('.hxpkg') }}

      - name: Cache Lime (source + built artifacts)
        id: lime-cache
        uses: actions/cache@v4
        with:
          path: .haxelib/lime
          key: lime-android-v2-6421de16b9dfa4fb55c19f12db65d392a57585c8-${{ runner.os }}

      - name: Install Linux system deps
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-13 g++-13 vlc libvlc-dev libvlccore-dev vlc-bin \
            libwayland-dev libwayland-bin wayland-protocols libasound2-dev \
            libpulse-dev libjack-jackd2-dev libpipewire-0.3-dev libgl1-mesa-dev \
            libegl1-mesa-dev libglu1-mesa-dev libdbus-1-dev libudev-dev \
            libxkbcommon-dev libx11-dev libxext-dev libx11-xcb-dev libxfixes-dev \
            libxss-dev libxrender-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxxf86vm-dev libgbm-dev libdrm-dev libdecor-0-dev \
            libvulkan-dev pkg-config

      - name: Setup haxelib root
        run: haxelib setup ~/haxelib

      - name: Install Haxe libraries
        if: steps.haxelibs-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install

      - name: Prepare Lime source
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf .haxelib/lime
          git clone https://github.com/FunkinCrew/lime .haxelib/lime/git
          git -C .haxelib/lime/git checkout 6421de16b9dfa4fb55c19f12db65d392a57585c8
          git -C .haxelib/lime/git submodule update --init --recursive --force

      - name: Register Lime dev lib
        run: haxelib dev lime .haxelib/lime/git

      - name: Ensure hxcpp for Lime rebuild
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: haxelib install hxcpp > /dev/null --quiet

      - name: Wrap g++-13 to force C++23
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/cxx-wrap
          printf '#!/bin/bash\nexec /usr/bin/g++-13 "$@" -std=c++23\n' > /tmp/cxx-wrap/g++-13
          chmod +x /tmp/cxx-wrap/g++-13
          echo "/tmp/cxx-wrap" >> $GITHUB_PATH

      - name: Rebuild Linux Lime ndll
        if: steps.lime-cache.outputs.cache-hit != 'true'
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          haxelib run lime rebuild cpp -release
          if [ ! -f .haxelib/lime/git/ndll/Linux64/lime.ndll ]; then
            echo "ERROR: Missing Lime ndll"
            exit 1
          fi

      - name: Prepare NDK clang++ for Android
        run: |
          mkdir -p /tmp/ndk-wrap
          NDK_PREBUILT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          {
            printf '#!/bin/bash\n'
            printf 'for arg in "$@"; do\n'
            printf '  case "$arg" in\n'
            printf '    *.c) exec "%s/bin/clang++" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@" ;;\n' "$NDK_PREBUILT" "$NDK_PREBUILT"
            printf '  esac\n'
            printf 'done\n'
            printf 'exec "%s/bin/clang++" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@" -std=c++23\n' "$NDK_PREBUILT" "$NDK_PREBUILT"
          } > /tmp/ndk-wrap/clang++
          printf '#!/bin/bash\nexec "%s/bin/clang" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@"\n' \
            "$NDK_PREBUILT" "$NDK_PREBUILT" > /tmp/ndk-wrap/clang
          printf '#!/bin/bash\nexec "%s/bin/llvm-strip" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/aarch64-linux-android-strip
          printf '#!/bin/bash\nexec "%s/bin/llvm-strip" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/arm-linux-androideabi-strip
          chmod +x /tmp/ndk-wrap/clang++ /tmp/ndk-wrap/clang \
            /tmp/ndk-wrap/aarch64-linux-android-strip /tmp/ndk-wrap/arm-linux-androideabi-strip
          echo "/tmp/ndk-wrap" >> $GITHUB_PATH

          # Replace ld.lld with a wrapper that handles ARM32 @response_file links.
          # hxcpp passes all linker args via a response file (one arg per line);
          # the wrapper rewrites it with versioned CRT paths and missing -L entries.
          # Script is base64-encoded to avoid YAML block-scalar indentation issues.
          mv "$NDK_PREBUILT/bin/ld.lld" "$NDK_PREBUILT/bin/ld.lld.real"
          echo '' \
            | base64 -d | sed "s|@NDK@|$NDK_PREBUILT|g" > "$NDK_PREBUILT/bin/ld.lld"
          chmod +x "$NDK_PREBUILT/bin/ld.lld"

      - name: Configure Android
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-

      - name: Patch SDL posix process for Android
        run: |
          echo "=== Scanning for SDL_posixprocess.c ==="
          FOUND=0
          while IFS= read -r SDL_FILE; do
            echo "Found: $SDL_FILE"
            if grep -q '^#ifndef __ANDROID__' "$SDL_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#ifndef __ANDROID__\n'; cat "$SDL_FILE"; printf '\n#endif\n'; } > /tmp/sdlfix
              mv /tmp/sdlfix "$SDL_FILE"
              echo "  Patched ($(wc -l < "$SDL_FILE") lines). First line: $(head -1 "$SDL_FILE")"
            fi
            FOUND=1
          done < <(find .haxelib/lime -name "SDL_posixprocess.c" -type f 2>/dev/null)
          if [ "$FOUND" = "0" ]; then
            echo "WARNING: SDL_posixprocess.c not found in .haxelib/lime (may be a cache-hit-only run)"
            find .haxelib -maxdepth 5 -type d 2>/dev/null | head -20 || true
          fi

          echo "=== Patching OpenAL lock-free assertion for ARM32 ==="
          while IFS= read -r AL_FILE; do
            echo "Found: $AL_FILE"
            if grep -q 'is_always_lock_free' "$AL_FILE"; then
              sed -i 's/static_assert(std::atomic<ContextBase::AsyncEventBitset>::is_always_lock_free,.*);/static_assert(true, "lock-free check relaxed for Android ARM32");/' "$AL_FILE"
              echo "  Patched: removed is_always_lock_free assertion"
            else
              echo "  No matching assertion found (already patched or different version)"
            fi
          done < <(find .haxelib/lime -path "*/openal/core/context.cpp" -type f 2>/dev/null)

          echo "=== Patching SDL_openxrdyn.c: OpenXR unsupported on ARM32 ==="
          while IFS= read -r XR_FILE; do
            echo "Found: $XR_FILE"
            if grep -q '^#if !defined(__arm__)' "$XR_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#if !defined(__arm__)\n'; cat "$XR_FILE"; printf '\n#endif\n'; } > /tmp/sdlxrfix
              mv /tmp/sdlxrfix "$XR_FILE"
              echo "  Patched: wrapped with #if !defined(__arm__)"
            fi
          done < <(find .haxelib/lime -name "SDL_openxrdyn.c" -type f 2>/dev/null)

          echo "=== Patching SDL_process.c: exclude process creation API on Android ==="
          while IFS= read -r SDL_PROC_FILE; do
            echo "Found: $SDL_PROC_FILE"
            if grep -q '^#ifndef __ANDROID__' "$SDL_PROC_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#ifndef __ANDROID__\n'; cat "$SDL_PROC_FILE"; printf '\n#endif\n'; } > /tmp/sdlprocfix
              mv /tmp/sdlprocfix "$SDL_PROC_FILE"
              echo "  Patched ($(wc -l < "$SDL_PROC_FILE") lines). First line: $(head -1 "$SDL_PROC_FILE")"
            fi
          done < <(find .haxelib/lime -name "SDL_process.c" -type f 2>/dev/null)

      - name: Rebuild Android Lime so
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          haxelib run lime rebuild android -release
          if [ ! -f .haxelib/lime/git/ndll/Android/liblime-64.so ]; then
            echo "ERROR: Missing Liblime 64 so"
            exit 1
          fi

      - name: Cache hxcpp build artifacts (ARM32)
        uses: actions/cache@v4
        with:
          path: |
            export/release/android/obj
            export/release/android/haxe
            obj
          key: hxcpp-android-arm32-${{ github.sha }}
          restore-keys: |
            hxcpp-android-arm32-

      - name: Compress video assets
        run: |
          # Identical to ARM64 job — each job checks out independently so each
          # must re-encode. ffmpeg is pre-installed on ubuntu-latest.
          find assets/legacy/videos -name "*.mp4" -type f | while IFS= read -r VID; do
            ORIG=$(stat -c%s "$VID")
            TMP="${VID%.mp4}__reenc.mp4"
            echo "Encoding: $VID  ($(numfmt --to=iec-i --suffix=B "$ORIG"))"
            if ffmpeg -y -i "$VID" \
                -c:v libx264 -crf 28 -preset faster \
                -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2" \
                -pix_fmt yuv420p \
                -c:a aac -b:a 64k \
                -movflags +faststart \
                -loglevel error \
                "$TMP"; then
              NEW=$(stat -c%s "$TMP")
              echo "  → $(numfmt --to=iec-i --suffix=B "$NEW")  (saved $(numfmt --to=iec-i --suffix=B $((ORIG - NEW))))"
              mv "$TMP" "$VID"
            else
              echo "  WARNING: ffmpeg failed — keeping original"
              rm -f "$TMP"
            fi
          done
          echo "Total videos after compression: $(du -sh assets/legacy/videos/ | cut -f1)"

      - name: Compile
        env:
          HXCPP_COMPILE_THREADS: 4
        run: |
          BUILD_FLAGS="${{inputs.buildFlags}}"
          if [ -n "$BUILD_FLAGS" ]; then
            haxelib run lime build android -release -D ANDROID_ARM32_ONLY -D $BUILD_FLAGS
          else
            haxelib run lime build android -release -D ANDROID_ARM32_ONLY
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NightmareVision (Android ARM32)
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
