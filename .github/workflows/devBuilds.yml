name: Dev Builds

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string

jobs:

  # ── Fat APK (arm64 + armv7 in one build).
  Android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: 4.3.7

      - name: Cache Haxe libraries
        id: haxelibs-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            .haxelib
          key: haxelibs-ubuntu-v3-${{ hashFiles('.hxpkg') }}

      - name: Cache Lime (source + built artifacts)
        id: lime-cache
        uses: actions/cache@v4
        with:
          path: .haxelib/lime
          key: lime-android-v2-6421de16b9dfa4fb55c19f12db65d392a57585c8-${{ runner.os }}

      - name: Install Linux system deps
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-13 g++-13 vlc libvlc-dev libvlccore-dev vlc-bin \
            libwayland-dev libwayland-bin wayland-protocols libasound2-dev \
            libpulse-dev libjack-jackd2-dev libpipewire-0.3-dev libgl1-mesa-dev \
            libegl1-mesa-dev libglu1-mesa-dev libdbus-1-dev libudev-dev \
            libxkbcommon-dev libx11-dev libxext-dev libx11-xcb-dev libxfixes-dev \
            libxss-dev libxrender-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxxf86vm-dev libgbm-dev libdrm-dev libdecor-0-dev \
            libvulkan-dev pkg-config

      - name: Setup haxelib root
        run: haxelib setup ~/haxelib

      - name: Install Haxe libraries
        if: steps.haxelibs-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install

      - name: Prepare Lime source
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf .haxelib/lime
          git clone https://github.com/FunkinCrew/lime .haxelib/lime/git
          git -C .haxelib/lime/git checkout 6421de16b9dfa4fb55c19f12db65d392a57585c8
          git -C .haxelib/lime/git submodule update --init --recursive --force

      - name: Register Lime dev lib
        run: haxelib dev lime .haxelib/lime/git

      - name: Ensure hxcpp for Lime rebuild
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: haxelib install hxcpp > /dev/null --quiet

      - name: Wrap g++-13 to force C++23
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/cxx-wrap
          printf '#!/bin/bash\nexec /usr/bin/g++-13 "$@" -std=c++23\n' > /tmp/cxx-wrap/g++-13
          chmod +x /tmp/cxx-wrap/g++-13
          echo "/tmp/cxx-wrap" >> $GITHUB_PATH

      - name: Rebuild Linux Lime ndll
        if: steps.lime-cache.outputs.cache-hit != 'true'
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          haxelib run lime rebuild cpp -release
          if [ ! -f .haxelib/lime/git/ndll/Linux64/lime.ndll ]; then
            echo "ERROR: Missing Lime ndll"
            exit 1
          fi

      - name: Prepare NDK clang++ for Android
        run: |
          mkdir -p /tmp/ndk-wrap
          NDK_PREBUILT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          {
            printf '#!/bin/bash\n'
            printf 'for arg in "$@"; do\n'
            printf '  case "$arg" in\n'
            printf '    *.c) exec "%s/bin/clang++" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@" ;;\n' "$NDK_PREBUILT" "$NDK_PREBUILT"
            printf '  esac\n'
            printf 'done\n'
            printf 'exec "%s/bin/clang++" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@" -std=c++23\n' "$NDK_PREBUILT" "$NDK_PREBUILT"
          } > /tmp/ndk-wrap/clang++
          printf '#!/bin/bash\nexec "%s/bin/clang" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@"\n' \
            "$NDK_PREBUILT" "$NDK_PREBUILT" > /tmp/ndk-wrap/clang
          printf '#!/bin/bash\nexec "%s/bin/llvm-strip" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/aarch64-linux-android-strip
          printf '#!/bin/bash\nexec "%s/bin/llvm-strip" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/arm-linux-androideabi-strip
          printf '#!/bin/bash\nexec "%s/bin/llvm-ar" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/arm-linux-androideabi-ar
          printf '#!/bin/bash\nexec "%s/bin/llvm-ar" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/aarch64-linux-android-ar
          printf '#!/bin/bash\nexec "%s/bin/llvm-ranlib" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/aarch64-linux-android-ranlib
          printf '#!/bin/bash\nexec "%s/bin/llvm-ranlib" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/arm-linux-androideabi-ranlib
          chmod +x /tmp/ndk-wrap/clang++ /tmp/ndk-wrap/clang \
            /tmp/ndk-wrap/aarch64-linux-android-strip /tmp/ndk-wrap/arm-linux-androideabi-strip \
            /tmp/ndk-wrap/arm-linux-androideabi-ar /tmp/ndk-wrap/aarch64-linux-android-ar \
            /tmp/ndk-wrap/aarch64-linux-android-ranlib /tmp/ndk-wrap/arm-linux-androideabi-ranlib
          echo "/tmp/ndk-wrap" >> $GITHUB_PATH
          mv "$NDK_PREBUILT/bin/ld.lld" "$NDK_PREBUILT/bin/ld.lld.real"
          echo '' \
            | base64 -d | sed "s|@NDK@|$NDK_PREBUILT|g" > "$NDK_PREBUILT/bin/ld.lld"
          chmod +x "$NDK_PREBUILT/bin/ld.lld"

      - name: Configure Android
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-

      - name: Patch SDL posix process for Android
        run: |
          FOUND=0
          while IFS= read -r SDL_FILE; do
            if grep -q '^#ifndef __ANDROID__' "$SDL_FILE"; then echo "  Already patched."; else
              { printf '#ifndef __ANDROID__\n'; cat "$SDL_FILE"; printf '\n#endif\n'; } > /tmp/sdlfix && mv /tmp/sdlfix "$SDL_FILE"
            fi; FOUND=1
          done < <(find .haxelib/lime -name "SDL_posixprocess.c" -type f 2>/dev/null)
          while IFS= read -r AL_FILE; do
            grep -q 'is_always_lock_free' "$AL_FILE" && sed -i 's/static_assert(std::atomic<ContextBase::AsyncEventBitset>::is_always_lock_free,.*);/static_assert(true, "lock-free check relaxed for Android ARM32");/' "$AL_FILE" || true
          done < <(find .haxelib/lime -path "*/openal/core/context.cpp" -type f 2>/dev/null)
          while IFS= read -r XR_FILE; do
            if grep -q '^#if !defined(__arm__)' "$XR_FILE"; then echo "  Already patched."; else
              { printf '#if !defined(__arm__)\n'; cat "$XR_FILE"; printf '\n#endif\n'; } > /tmp/sdlxrfix && mv /tmp/sdlxrfix "$XR_FILE"
            fi
          done < <(find .haxelib/lime -name "SDL_openxrdyn.c" -type f 2>/dev/null)
          while IFS= read -r SDL_PROC_FILE; do
            if grep -q '^#ifndef __ANDROID__' "$SDL_PROC_FILE"; then echo "  Already patched."; else
              { printf '#ifndef __ANDROID__\n'; cat "$SDL_PROC_FILE"; printf '\n#endif\n'; } > /tmp/sdlprocfix && mv /tmp/sdlprocfix "$SDL_PROC_FILE"
            fi
          done < <(find .haxelib/lime -name "SDL_process.c" -type f 2>/dev/null)

      - name: Rebuild Android Lime so
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          haxelib run lime rebuild android -release
          if [ ! -f .haxelib/lime/git/ndll/Android/liblime-64.so ]; then
            echo "ERROR: Missing Liblime 64 so"
            exit 1
          fi

      - name: Seed hxcpp compile cache from impostor branch
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: devBuilds.yml
          branch: claude/impostor-legacy-android-79u6sz
          name: hxcpp-cache-seed-android-fat
          path: /tmp/hxcpp-seed

      - name: Extract hxcpp compile cache seed
        continue-on-error: true
        run: |
          if [ -f /tmp/hxcpp-seed/hxcpp-cache-fat.tar.gz ]; then
            mkdir -p "$HOME/.hxcpp_cache"
            tar -xzf /tmp/hxcpp-seed/hxcpp-cache-fat.tar.gz -C "$HOME" || true
            echo "Seeded $(find "$HOME/.hxcpp_cache" -type f | wc -l) files from impostor branch"
          else
            echo "No cache seed found, building from scratch"
          fi

      - name: Cache hxcpp compile cache
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp_cache
          key: hxcpp-cache-android-fat-${{ runner.os }}-${{ hashFiles('source/**/*.hx', 'source/**/**/*.hx', 'source/**/**/**/*.hx', 'Project.xml', '.hxpkg', 'include.xml') }}
          restore-keys: |
            hxcpp-cache-android-fat-${{ runner.os }}-

      - name: Compile
        env:
          HXCPP_COMPILE_THREADS: "4"
          HXCPP_CACHE_MB: "4000"
        run: |
          export HXCPP_COMPILE_CACHE="$HOME/.hxcpp_cache"
          mkdir -p "$HXCPP_COMPILE_CACHE"
          BUILD_FLAGS="${{inputs.buildFlags}}"
          if [ -n "$BUILD_FLAGS" ]; then
            haxelib run lime build android -release -D $BUILD_FLAGS
          else
            haxelib run lime build android -release
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NightmareVision (Android)
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────────
