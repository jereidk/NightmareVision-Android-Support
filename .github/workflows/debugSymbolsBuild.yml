name: Impostor Legacy - Debug Symbols Build

# Dedicated, on-demand workflow for producing a build whose native crash
# traces (native_crash_trace.log's rel_pc offsets) can actually be resolved
# to real function/file/line via addr2line/ndk-stack -- separate from
# devBuilds.yml because it costs real compile time and artifact size that a
# routine dev build shouldn't always pay for.
#
# ARM64-only on purpose: this exists specifically to chase down a crash
# reported from a real device, and every device we've seen a
# native_crash_trace.log from so far has been arm64-v8a.
#
# Two layers of symbol preservation are involved, since one alone isn't
# enough (confirmed by actually inspecting the debug-symbols.zip a plain
# `debugSymbolLevel = "FULL"` produced -- it only had libc++_shared.so.dbg,
# never the game's own library):
#
#   1. android.buildTypes.release.ndk.debugSymbolLevel = "FULL"
#      (patch-lime-gradle-native-symbols.sh) -- Gradle's own mechanism,
#      but it can only preserve debug info that still EXISTS at Gradle
#      packaging time. It works for prebuilt NDK libraries (libc++_shared.so)
#      that Gradle processes itself, but does nothing for our own compiled
#      library: HXCPP already strips that one, earlier, before Gradle ever
#      sees it.
#
#   2. -D HXCPP_DEBUG_LINK_AND_STRIP -- HXCPP's own toolchain (see
#      android-toolchain-gcc.xml / finish-setup.xml in the hxcpp haxelib)
#      normally links our library straight to a stripped .so via
#      -Wl,--strip-all. This define instead links WITH full debug info
#      (-g) and defers stripping to a separate external `strip` call --
#      the same aarch64-linux-android-strip wrapper this workflow already
#      provides to satisfy the NDK toolchain. That wrapper is modified
#      below to save an unstripped copy of any .so it's about to strip,
#      before it actually strips it, so the final packaged .so is
#      identical in size/behavior to a normal release build, but we also
#      get to keep the pre-strip copy as a build artifact.
#
# Uses a separate hxcpp compile-cache key from devBuilds.yml's release
# build: HXCPP_DEBUG_LINK_AND_STRIP changes what gets passed to the
# compiler/linker (adds -g), and devBuilds.yml's own comments already
# document that seeding an hxcpp object cache across a haxedef toggle like
# this produces mass "undefined symbol" link failures -- so this build
# gets its own cache lineage instead of ever touching (or being seeded
# from) the normal release one.

on:
  workflow_dispatch:
    inputs:
      buildFlags:
        description: 'Extra -D flags (space-separated), if needed'
        required: false
        type: string

jobs:
  Android-ARM64-DebugSymbols:
    name: Build Android (ARM64, debug symbols)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: 4.3.7

      - name: Cache Haxe libraries
        id: haxelibs-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            .haxelib
          key: haxelibs-ubuntu-v3-${{ hashFiles('.hxpkg') }}

      # Shared with devBuilds.yml's own jobs on purpose -- this is Lime's
      # source + its own built liblime.so, unaffected by HXCPP_DEBUG_LINK_AND_STRIP
      # (that define only changes how OUR app library gets linked/stripped).
      - name: Cache Lime (source + built artifacts)
        id: lime-cache
        uses: actions/cache@v4
        with:
          path: .haxelib/lime
          key: lime-android-v5-${{ hashFiles('.hxpkg') }}-${{ runner.os }}-arm64

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-13 g++-13 vlc libvlc-dev libvlccore-dev vlc-bin \
            libwayland-dev libwayland-bin wayland-protocols libasound2-dev \
            libpulse-dev libjack-jackd2-dev libpipewire-0.3-dev libgl1-mesa-dev \
            libegl1-mesa-dev libglu1-mesa-dev libdbus-1-dev libudev-dev \
            libxkbcommon-dev libx11-dev libxext-dev libx11-xcb-dev libxfixes-dev \
            libxss-dev libxrender-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxxf86vm-dev libgbm-dev libdrm-dev libdecor-0-dev \
            libvulkan-dev pkg-config

      - name: Setup haxelib root
        run: haxelib setup ~/haxelib

      - name: Install Haxe libraries
        if: steps.haxelibs-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg --quiet
          haxelib run hxpkg install --force

      - name: Prepare Lime source
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf .haxelib/lime
          git clone https://github.com/FunkinCrew/lime .haxelib/lime/git
          git -C .haxelib/lime/git checkout 6421de16b9dfa4fb55c19f12db65d392a57585c8
          git -C .haxelib/lime/git submodule update --init --recursive --force

      - name: Register Lime dev lib
        run: haxelib dev lime .haxelib/lime/git

      - name: Ensure hxcpp for Lime rebuild
        run: haxelib install hxcpp > /dev/null --quiet

      - name: Wrap g++-13 to force C++23
        run: |
          mkdir -p /tmp/cxx-wrap
          printf '#!/bin/bash\nexec /usr/bin/g++-13 "$@" -std=c++23\n' > /tmp/cxx-wrap/g++-13
          chmod +x /tmp/cxx-wrap/g++-13
          echo "/tmp/cxx-wrap" >> $GITHUB_PATH

      - name: Rebuild Linux Lime ndll
        timeout-minutes: 15
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          set -euo pipefail
          if [ -f .haxelib/lime/git/ndll/Linux64/lime.ndll ]; then
            echo "lime.ndll already present, skipping rebuild."
          else
            echo "lime.ndll missing (fresh checkout, or a cache that lost it)."
            echo "Re-cloning Lime from scratch before rebuilding."
            rm -rf .haxelib/lime/git
            git clone https://github.com/FunkinCrew/lime .haxelib/lime/git
            git -C .haxelib/lime/git checkout 6421de16b9dfa4fb55c19f12db65d392a57585c8
            git -C .haxelib/lime/git submodule update --init --recursive --force
            haxelib run lime rebuild cpp -release
            if [ ! -f .haxelib/lime/git/ndll/Linux64/lime.ndll ]; then
              echo "ERROR: Missing Lime ndll after rebuild"
              exit 1
            fi
          fi

      # Same NDK toolchain wrapper as devBuilds.yml's ARM64 job, with one
      # change: the *-strip wrappers save an unstripped copy of any .so
      # they're about to strip into ~/unstripped-so before actually
      # stripping it. Harmless on its own (HXCPP_DEBUG_LINK_AND_STRIP below
      # is what makes there be real debug info left to save by the time
      # this runs -- without it, the .so would already be link-time
      # stripped via -Wl,--strip-all and this would just be saving an
      # already-empty shell).
      - name: Prepare NDK clang++ for Android
        run: |
          mkdir -p /tmp/ndk-wrap
          NDK_PREBUILT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          {
            printf '#!/bin/bash\n'
            printf 'for arg in "$@"; do\n'
            printf '  case "$arg" in\n'
            printf '    *.c) exec "%s/bin/clang++" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@" ;;\n' "$NDK_PREBUILT" "$NDK_PREBUILT"
            printf '  esac\n'
            printf 'done\n'
            printf 'exec "%s/bin/clang++" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@" -std=c++23\n' "$NDK_PREBUILT" "$NDK_PREBUILT"
          } > /tmp/ndk-wrap/clang++
          printf '#!/bin/bash\nexec "%s/bin/clang" "--sysroot=%s/sysroot" -D__ANDROID__ -Wno-macro-redefined "$@"\n' \
            "$NDK_PREBUILT" "$NDK_PREBUILT" > /tmp/ndk-wrap/clang
          mkdir -p "$HOME/unstripped-so"
          {
            printf '#!/bin/bash\n'
            printf 'mkdir -p "%s/unstripped-so"\n' "$HOME"
            printf 'for arg in "$@"; do\n'
            printf '  case "$arg" in\n'
            printf '    *.so) cp -f "$arg" "%s/unstripped-so/$(basename "$arg")" 2>/dev/null || true ;;\n' "$HOME"
            printf '  esac\n'
            printf 'done\n'
            printf 'exec "%s/bin/llvm-strip" "$@"\n' "$NDK_PREBUILT"
          } > /tmp/ndk-wrap/aarch64-linux-android-strip
          printf '#!/bin/bash\nexec "%s/bin/llvm-strip" "$@"\n' \
            "$NDK_PREBUILT" > /tmp/ndk-wrap/arm-linux-androideabi-strip
          chmod +x /tmp/ndk-wrap/clang++ /tmp/ndk-wrap/clang \
            /tmp/ndk-wrap/aarch64-linux-android-strip /tmp/ndk-wrap/arm-linux-androideabi-strip
          echo "/tmp/ndk-wrap" >> $GITHUB_PATH

          # ld.lld wrapper is needed even for the ARM64 job: lime rebuild android
          # also links liblime-v7.so (ARM32) which hits the same NDK 29 sysroot issue.
          mv "$NDK_PREBUILT/bin/ld.lld" "$NDK_PREBUILT/bin/ld.lld.real"
          echo '' \
            | base64 -d | sed "s|@NDK@|$NDK_PREBUILT|g" > "$NDK_PREBUILT/bin/ld.lld"
          chmod +x "$NDK_PREBUILT/bin/ld.lld"

      - name: Configure Android
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-arm64-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-arm64-

      - name: Patch SDL posix process for Android
        run: |
          echo "=== Scanning for SDL_posixprocess.c ==="
          FOUND=0
          while IFS= read -r SDL_FILE; do
            echo "Found: $SDL_FILE"
            if grep -q '^#ifndef __ANDROID__' "$SDL_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#ifndef __ANDROID__\n'; cat "$SDL_FILE"; printf '\n#endif\n'; } > /tmp/sdlfix
              mv /tmp/sdlfix "$SDL_FILE"
              echo "  Patched ($(wc -l < "$SDL_FILE") lines). First line: $(head -1 "$SDL_FILE")"
            fi
            FOUND=1
          done < <(find .haxelib/lime -name "SDL_posixprocess.c" -type f 2>/dev/null)
          if [ "$FOUND" = "0" ]; then
            echo "WARNING: SDL_posixprocess.c not found in .haxelib/lime (may be a cache-hit-only run)"
            find .haxelib -maxdepth 5 -type d 2>/dev/null | head -20 || true
          fi

          echo "=== Patching OpenAL lock-free assertion for ARM32 ==="
          while IFS= read -r AL_FILE; do
            echo "Found: $AL_FILE"
            if grep -q 'is_always_lock_free' "$AL_FILE"; then
              sed -i 's/static_assert(std::atomic<ContextBase::AsyncEventBitset>::is_always_lock_free,.*);/static_assert(true, "lock-free check relaxed for Android ARM32");/' "$AL_FILE"
              echo "  Patched: removed is_always_lock_free assertion"
            else
              echo "  No matching assertion found (already patched or different version)"
            fi
          done < <(find .haxelib/lime -path "*/openal/core/context.cpp" -type f 2>/dev/null)

          echo "=== Patching SDL_openxrdyn.c: OpenXR unsupported on ARM32 ==="
          while IFS= read -r XR_FILE; do
            echo "Found: $XR_FILE"
            if grep -q '^#if !defined(__arm__)' "$XR_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#if !defined(__arm__)\n'; cat "$XR_FILE"; printf '\n#endif\n'; } > /tmp/sdlxrfix
              mv /tmp/sdlxrfix "$XR_FILE"
              echo "  Patched: wrapped with #if !defined(__arm__)"
            fi
          done < <(find .haxelib/lime -name "SDL_openxrdyn.c" -type f 2>/dev/null)

          echo "=== Patching SDL_process.c: exclude process creation API on Android ==="
          while IFS= read -r SDL_PROC_FILE; do
            echo "Found: $SDL_PROC_FILE"
            if grep -q '^#ifndef __ANDROID__' "$SDL_PROC_FILE"; then
              echo "  Already patched, skipping."
            else
              { printf '#ifndef __ANDROID__\n'; cat "$SDL_PROC_FILE"; printf '\n#endif\n'; } > /tmp/sdlprocfix
              mv /tmp/sdlprocfix "$SDL_PROC_FILE"
              echo "  Patched ($(wc -l < "$SDL_PROC_FILE") lines). First line: $(head -1 "$SDL_PROC_FILE")"
            fi
          done < <(find .haxelib/lime -name "SDL_process.c" -type f 2>/dev/null)

      - name: Patch lime audio for Android (cheaper resampler, timer-based completion)
        run: |
          echo "=== Patching AudioManager.hx: cheaper OpenAL resampler on Android ==="
          while IFS= read -r AM_FILE; do
            echo "Found: $AM_FILE"
            python3 .github/scripts/patch-lime-audio-resampler.py "$AM_FILE"
          done < <(find .haxelib/lime -path "*lime/media/AudioManager.hx" -type f 2>/dev/null)

          echo "=== Patching NativeAudioSource.hx: timer-based completion instead of per-frame polling ==="
          while IFS= read -r NAS_FILE; do
            echo "Found: $NAS_FILE"
            python3 .github/scripts/patch-lime-audio-completion.py "$NAS_FILE"
          done < <(find .haxelib/lime -path "*_internal/backend/native/NativeAudioSource.hx" -type f 2>/dev/null)

      - name: Patch hscript-iris Iris.call() to reuse its result object
        run: |
          while IFS= read -r IRIS_FILE; do
            echo "Found: $IRIS_FILE"
            python3 .github/scripts/patch-hscript-iris-call.py "$IRIS_FILE"
          done < <(find .haxelib -path "*crowplexus/iris/Iris.hx" -type f 2>/dev/null)

      - name: Rebuild Android Lime so
        run: |
          if [ -f .haxelib/lime/git/ndll/Android/liblime-64.so ] && [ -f .haxelib/lime/git/ndll/Android/liblime-v7.so ]; then
            echo "Android liblime .so files already present, skipping rebuild."
          else
            echo "Android liblime .so missing (fresh checkout after hxpkg --force or ndll self-heal). Rebuilding."
            haxelib run lime rebuild android -release
          fi
          if [ ! -f .haxelib/lime/git/ndll/Android/liblime-64.so ] || [ ! -f .haxelib/lime/git/ndll/Android/liblime-v7.so ]; then
            echo "ERROR: Missing Android liblime .so after rebuild"
            exit 1
          fi

      - name: Apply Gradle ABI splits for ARM64
        run: |
          bash .github/scripts/patch-lime-gradle.sh arm64

      - name: Enable native debug symbols output for release
        run: bash .github/scripts/patch-lime-gradle-native-symbols.sh

      # Separate cache lineage from devBuilds.yml's release build on purpose
      # -- see the top-of-file comment on HXCPP_DEBUG_LINK_AND_STRIP.
      - name: Cache hxcpp build artifacts (ARM64, debug symbols)
        uses: actions/cache@v4
        with:
          path: |
            export/release/android/obj
            export/release/android/haxe
            obj
          key: hxcpp-android-arm64-debugsyms-v1-${{ runner.os }}-${{ hashFiles('source/**/*.hx', 'source/**/**/*.hx', 'source/**/**/**/*.hx', 'Project.xml', '.hxpkg', 'include.xml') }}
          restore-keys: |
            hxcpp-android-arm64-debugsyms-v1-${{ runner.os }}-

      - name: Prune stale hxcpp compile caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-stale-hxcpp-cache.sh "hxcpp-android-arm64-debugsyms-v1-${{ runner.os }}-" "${{ github.ref }}"

      - name: Compile
        env:
          HXCPP_COMPILE_THREADS: 4
        run: |
          BUILD_FLAGS="${{inputs.buildFlags}}"
          if [ -n "$BUILD_FLAGS" ]; then
            haxelib run lime build android -release -D ANDROID_ARM64_ONLY -D HXCPP_DEBUG_LINK_AND_STRIP -D $BUILD_FLAGS
          else
            haxelib run lime build android -release -D ANDROID_ARM64_ONLY -D HXCPP_DEBUG_LINK_AND_STRIP
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: VS Impostor Legacy (Android ARM64, debug symbols)
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload native debug symbols (Gradle-processed libraries)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Native Debug Symbols - Gradle (Android ARM64)
          path: export/release/android/bin/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: warn

      # The one that actually matters for symbolizing a native_crash_trace.log:
      # the game's own library, saved unstripped by the *-strip wrapper above
      # before the real llvm-strip ran on it. Zipped here since
      # upload-artifact doesn't need one, but a raw .so glob directly out of
      # $HOME is easier to get wrong across shells than just zipping it first.
      - name: Zip unstripped game library
        run: |
          if [ -z "$(ls -A "$HOME/unstripped-so" 2>/dev/null)" ]; then
            echo "ERROR: no unstripped .so files were captured -- HXCPP_DEBUG_LINK_AND_STRIP may not have taken effect, or the strip wrapper never ran"
            exit 1
          fi
          ls -la "$HOME/unstripped-so"
          cd "$HOME/unstripped-so"
          zip -r "$GITHUB_WORKSPACE/unstripped-game-library.zip" .

      - name: Upload unstripped game library
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Unstripped Game Library (Android ARM64)
          path: unstripped-game-library.zip
          if-no-files-found: error
