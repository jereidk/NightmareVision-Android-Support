name: Symbolize Native Crash

# Resolves rel_pc offsets from a device tombstone (native_crash_trace log)
# against the Native Debug Symbols artifact of the run that built the
# installed APK. Exists because the artifact storage host is not reachable
# from every analysis environment -- this runs the symbolization where the
# artifact IS reachable and prints results straight into the job log.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run id that produced the symbols artifact'
        required: true
        type: string
      artifact_name:
        description: 'Symbols artifact name'
        required: false
        type: string
        default: 'Native Debug Symbols (Android ARM64)'
      offsets:
        description: 'Comma-separated hex rel_pc offsets (no 0x prefix needed)'
        required: true
        type: string

jobs:
  symbolize:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download symbols artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: syms

      - name: Inspect and symbolize
        run: |
          set +e
          echo "=== artifact contents ==="
          ls -laR syms
          mkdir -p unzipped
          for z in syms/*.zip; do unzip -o "$z" -d unzipped; done
          echo "=== unzipped ==="
          find unzipped -type f -exec ls -la {} \;
          find unzipped -type f -exec file {} \;

          MAIN=$(find unzipped -type f \( -iname "*ApplicationMain*" -o -iname "*.so.sym" -o -iname "*.so.dbg" -o -iname "*.so" \) | grep -i -m1 applicationmain)
          if [ -z "$MAIN" ]; then
            echo "NO ApplicationMain symbol file found in the artifact -- listing everything instead:"
            find unzipped -type f
            exit 0
          fi
          echo "=== symbolizing against: $MAIN ==="
          file "$MAIN"

          A2L=$(command -v llvm-addr2line || command -v llvm-addr2line-18 || command -v llvm-addr2line-16 || command -v addr2line)
          echo "using: $A2L"
          IFS=',' read -ra OFFS <<< "${{ inputs.offsets }}"
          for o in "${OFFS[@]}"; do
            o="${o#0x}"
            echo "--- 0x$o ---"
            "$A2L" -e "$MAIN" -f -C -i "0x$o"
          done
